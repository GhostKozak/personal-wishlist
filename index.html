<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Wishlist Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Personal Wishlist</h1>
  </header>

  <main>
    <section class="form-section">
      <h2>Add New Item</h2>
      <form id="wishlist-form">
        <div class="form-group">
          <label for="item-name">Name : </label>
          <input type="text" id="item-name" name="name" required placeholder="Item name">
        </div>

        <div class="form-group">
          <label for="item-link">Link : </label>
          <input type="url" id="item-link" name="link" placeholder="https://example.com">
        </div>

        <div class="form-group">
          <label for="item-price">Price : </label>
          <input type="number" id="item-price" name="price" step="0.01" min="0" placeholder="0.00" required>
        </div>

        <div class="form-group">
          <label for="item-importance">Importance : </label>
          <select name="importance" id="item-importance" required>
            <option value="important">Important (Gerekli / Kritik)</option>
            <option value="not-important">Not Important (Konfor / İstek)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="item-urgency">Urgency : </label>
          <select name="urgency" id="item-urgency" required>
            <option value="urgent">Urgent (Hemen Lazım)</option>
            <option value="not-urgent">Not Urgent (Zamanı Var)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="item-installment">Is Installment :</label>
          <input type="checkbox" name="isInstallment" id="item-installment">
        </div>

        <div class="form-group">
          <label for="item-installmentCount">Installment Count :</label>
          <select name="installmentCount" id="item-installmentCount">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>

        <button type="submit">Save to Wishlist</button>
      </form>
    </section>

      <h2>Budget AND Installment Summary</h2>
      <div class="summary-cards">
        <div class="card">
          <span class="card-title">Total Wishlist Value</span>

        <div class="card">
          <span class="card-title">Installment Items</span>
          <span class="card-value" id="installment-count">0 Item</span>
        </div>
      </div>
    </section> -->

    <section class="table-section">
      <h2>My Wishlist</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Payment</th>
            <th>Priority</th>
            <th>Link</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="wishlist-view">
          <!-- JavaScript ile dinamik olarak doldurulacak -->
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Wishlist App</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
