<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Arka Plan: Koyu Tema ve Yuvarlatılmış Köşeler -->
  <rect width="64" height="64" rx="16" fill="#161b22"/>
  
  <!-- Dış Çerçeve / İnce Işıma -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#30363d" stroke-width="2"/>

  <!-- Liste / Belge Gövdesi (Mor Degrade) -->
  <defs>
    <linearGradient id="purpleGrad" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#642f99"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="16" y="14" width="32" height="38" rx="6" fill="url(#purpleGrad)" filter="url(#shadow)"/>

  <!-- Liste Satırları -->
  <rect x="22" y="24" width="16" height="3" rx="1.5" fill="#f0f6fc" opacity="0.9"/>
  <rect x="22" y="31" width="20" height="3" rx="1.5" fill="#f0f6fc" opacity="0.7"/>
  <rect x="22" y="38" width="12" height="3" rx="1.5" fill="#f0f6fc" opacity="0.5"/>

  <!-- Sağ Üst Rozet: İstek / Yıldız İkonu (Yeşil - Başarı/Kazanç Rengi) -->
  <circle cx="44" cy="18" r="9" fill="#90bb01" stroke="#161b22" stroke-width="2.5"/>
  <path d="M44 13.5L45.4 16.3L48.5 16.8L46.2 19L46.8 22.1L44 20.6L41.2 22.1L41.8 19L39.5 16.8L42.6 16.3L44 13.5Z" fill="#161b22"/>
</svg>
